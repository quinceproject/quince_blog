# Trasy panelu quince_blog. `_legacy_controller: AdminQuinceBlog` to zakładka
# zadeklarowana w `quince_blog.php::installTabs()`, od niej PrestaShop
# sprawdza uprawnienia do każdej z tych tras.

quince_blog_posts:
  path: quince/blog/posts
  methods: [GET]
  defaults:
    _controller: Quince\Blog\Controller\Admin\PostsController::indexAction
    _legacy_controller: 'AdminQuinceBlog'
    _legacy_link: 'AdminQuinceBlog'

quince_blog_posts_edit:
  path: quince/blog/posts/{id}/edit
  methods: [GET]
  defaults:
    _controller: Quince\Blog\Controller\Admin\PostsController::editAction
    _legacy_controller: 'AdminQuinceBlog'
    _legacy_link: 'AdminQuinceBlog'

quince_blog_posts_save:
  path: quince/blog/posts/save
  methods: [POST]
  defaults:
    _controller: Quince\Blog\Controller\Admin\PostsController::saveAction
    _legacy_controller: 'AdminQuinceBlog'
    _legacy_link: 'AdminQuinceBlog:save'

quince_blog_posts_delete:
  path: quince/blog/posts/delete
  methods: [POST]
  defaults:
    _controller: Quince\Blog\Controller\Admin\PostsController::deleteAction
    _legacy_controller: 'AdminQuinceBlog'
    _legacy_link: 'AdminQuinceBlog'

